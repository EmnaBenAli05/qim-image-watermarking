name: CI
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
 
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
 
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
 
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
 
      - name: Run tests
        run: python -m pytest -v
 
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
 
      - name: Build image
        run: docker build -t qim-watermark-project .
 
      - name: Run container without a terminal
        run: docker run --name qim-run -e QIM_KEY=ci-test-key qim-watermark-project
 
      - name: Check outputs and key handling
        run: |
          docker cp qim-run:/app/outputs/metrics.txt metrics.txt
          cat metrics.txt
          grep -q "Key source : environment variable QIM_KEY" metrics.txt
          if grep -q "ci-test-key" metrics.txt; then
            echo "The secret key leaked into metrics.txt"
            exit 1
          fi